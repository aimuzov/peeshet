name: Check

# На main эти проверки вызывает workflow деплоя перед выкаткой, а ветки
# проверяются через PR. Отдельный прогон на push дал бы дубль на тот же коммит.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reuse verified CI
        id: verified
        uses: aimuzov/infra-ci/reuse-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
      - uses: actions/checkout@v5
        if: steps.verified.outputs.reused != 'true'
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: npm
        if: steps.verified.outputs.reused != 'true'
      - run: npm ci
        if: steps.verified.outputs.reused != 'true'
      - run: npm run format:check
        if: steps.verified.outputs.reused != 'true'
      - run: npm run lint:js
        if: steps.verified.outputs.reused != 'true'
      - run: npm run check
        if: steps.verified.outputs.reused != 'true'
      - run: npm test
        if: steps.verified.outputs.reused != 'true'
      # Образ собирается и на сервере, но лучше, чтобы он сломался здесь.
      - run: docker build -f deploy/Dockerfile .
        if: steps.verified.outputs.reused != 'true'
      - name: Record verified CI
        if: github.event_name == 'pull_request' && steps.verified.outputs.reused != 'true'
        uses: aimuzov/infra-ci/record-check@v1
        continue-on-error: true
        with:
          workflow: .github/workflows/check.yml
